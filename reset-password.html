
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | CyberGuard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d18;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #121b2b;
      border: 1px solid #26354a;
      border-radius: 18px;
      padding: 32px;
      text-align: center;
    }
    h1 { color: #21d5c5; }
    p { color: #aebccd; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      background: #202c3c;
      color: white;
      border: 1px solid #41516a;
    }
    button {
      border: 0;
      background: #10b9aa;
      color: #06131b;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #message { margin-top: 18px; }
    .error { color: #ff9292 !important; }
    .success { color: #70e6b6 !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>⬡ CyberGuard</h1>
    <h2>Reset Your Password</h2>
    <p id="description">Checking your recovery link...</p>

    <form id="resetForm" hidden>
      <input
        id="password"
        type="password"
        placeholder="New password"
        minlength="12"
        autocomplete="new-password"
        required
      >
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        minlength="12"
        autocomplete="new-password"
        required
      >
      <button id="submitButton" type="submit">
        Update Password
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Replace these with your Supabase project settings.
    // Use the publishable/anon key, NEVER the service_role key.
    const SUPABASE_URL = "https://trjbjiprwzhweoomkruq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyamJqaXByd3pod2Vvb21rcnVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MzM5NTEsImV4cCI6MjEwNzMwOTk1MX0.oI1zkLHVB-uqpl_-2YGv3DtV70wc8TeIz5CUl3WkPu0";

    const description = document.getElementById("description");
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.className = success ? "success" : "error";
    }

    if (
      SUPABASE_URL.startsWith("YOUR_") ||
      SUPABASE_KEY.startsWith("YOUR_")
    ) {
      description.textContent = "Page configuration is incomplete.";
      showMessage("Configure your Supabase URL and publishable key.");
    } else {
      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          detectSessionInUrl: true,
          persistSession: false,
          autoRefreshToken: false
        }
      });

      async function initializeRecovery() {
        const hash = new URLSearchParams(
          window.location.hash.slice(1)
        );
        const query = new URLSearchParams(window.location.search);

        if (hash.get("error") || query.get("error")) {
          description.textContent = "Recovery link failed.";
          showMessage(
            hash.get("error_description") ||
            query.get("error_description") ||
            "This link is invalid or expired."
          );
          return;
        }

        const tokenHash = query.get("token_hash");
        const type = query.get("type");
        const code = query.get("code");

        try {
          if (tokenHash && type === "recovery") {
            const { error } = await supabase.auth.verifyOtp({
              token_hash: tokenHash,
              type: "recovery"
            });
            if (error) throw error;
          } else if (code) {
            const { error } =
              await supabase.auth.exchangeCodeForSession(code);
            if (error) throw error;
          } else {
            // Allow supabase-js to process legacy fragment tokens.
            await new Promise(resolve => setTimeout(resolve, 500));
          }

          const { data, error } = await supabase.auth.getUser();

          if (error || !data.user) {
            throw new Error(
              "Invalid or expired recovery link. Request a new email."
            );
          }

          if (
            !tokenHash &&
            !code &&
            hash.get("type") !== "recovery"
          ) {
            throw new Error(
              "Please open this page using a password-reset email."
            );
          }

          description.textContent = "Enter your new password below.";
          form.hidden = false;

          // Remove sensitive recovery tokens from the address bar.
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );
        } catch (error) {
          description.textContent = "Unable to reset password.";
          showMessage(error.message);
        }

        form.addEventListener("submit", async event => {
          event.preventDefault();

          const password =
            document.getElementById("password").value;
          const confirm =
            document.getElementById("confirmPassword").value;

          if (password !== confirm) {
            showMessage("Passwords do not match.");
            return;
          }

          if (password.length < 12) {
            showMessage("Use at least 12 characters.");
            return;
          }

          button.disabled = true;
          showMessage("");

          const { error } = await supabase.auth.updateUser({
            password
          });

          if (error) {
            showMessage(error.message);
            button.disabled = false;
            return;
          }

          form.hidden = true;
          description.textContent = "Password updated successfully!";
          showMessage(
            "You can now sign in to CyberGuard with your new password.",
            true
          );

          await supabase.auth.signOut();
        });
      }

      initializeRecovery();
    }
  </script>
</body>
</html>
